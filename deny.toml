[graph]
targets = []
all-features = true
no-default-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# Tantivy 0.26.1 requires lru 0.16.x; the fixed lru release is outside
# Tantivy's dependency range. Nous does not instantiate LruCache directly.
ignore = ["RUSTSEC-2026-0253"]

[licenses]
version = 2
include-dev = true
include-build = true
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

syntax = "proto3";
package nous.wave.v1alpha1;
import "nous/wave/v1alpha1/types.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message ResourceDescriptor {
  string resource_ref = 1;
  string display_label = 2;
  string authority_class = 3;
  google.protobuf.Struct coverage = 4;
  repeated string query_dimensions = 5;
  repeated string modalities = 6;
  google.protobuf.Struct freshness_policy = 7;
  string access_cost_class = 8;
  string readiness = 9;
}
message PutResourceRequest { string subject_id = 1; ResourceDescriptor descriptor = 2; }
message ListResourcesResponse { repeated ResourceDescriptor items = 1; string next_page_token = 2; }
message Tag { string tag_id = 1; string label = 2; optional string description = 3; optional string kind_hint = 4; string origin = 5; }
message CreateTagRequest { string subject_id = 1; Tag tag = 2; }
message ListTagsResponse { repeated Tag items = 1; string next_page_token = 2; }
message AnchorSupport { CognitiveRef reference = 1; string role = 2; }
message Anchor { string anchor_id = 1; optional string label = 2; string description = 3; string origin = 4; bool confirmed = 5; repeated AnchorSupport supports = 6; }
message CreateAnchorRequest { string subject_id = 1; Anchor anchor = 2; }
message ListAnchorsResponse { repeated Anchor items = 1; string next_page_token = 2; }
message Association {
  string association_id = 1;
  CognitiveRef from = 2;
  CognitiveRef to = 3;
  string kind = 4;
  string polarity = 5;
  string support_class = 6;
  double support_value = 7;
  optional string occurrence_id = 8;
  optional string memory_revision_id = 9;
  bool bridge_hint = 10;
}
message CreateAssociationRequest { string subject_id = 1; Association association = 2; }
message NeighborhoodRequest { string subject_id = 1; CognitiveRef root = 2; uint32 max_nodes = 3; uint32 max_depth = 4; }
message NeighborhoodResponse { repeated CognitiveRef nodes = 1; repeated Association associations = 2; bool truncated = 3; }
message RebindEntityRequest { string subject_id = 1; string mention_id = 2; optional string entity_ref = 3; string binding_state = 4; optional string host_resolution_ref = 5; optional string reason = 6; }
message TopologyTagChange { optional string existing_tag_id = 1; Tag tag = 2; repeated string attach_to_revision_ids = 3; }
message TopologyRevisionChange { string memory_id = 1; string expected_etag = 2; string intent = 3; MemoryContent content = 4; repeated string entity_refs = 5; }
message TopologyChanges { repeated TopologyTagChange tags = 1; repeated Anchor anchors = 2; repeated Association associations = 3; repeated TopologyRevisionChange revisions = 4; }
message ConsolidateMemoryRequest { string subject_id = 1; repeated string source_revision_ids = 2; string target = 3; string text = 4; string semantic_role = 5; TopologyChanges topology = 6; }
message ConsolidationResponse { Memory memory = 1; uint32 topology_changes = 2; }
message Occurrence {
  string occurrence_id = 1;
  string subject_id = 2;
  optional string artifact_id = 3;
  string source_class = 4;
  optional string external_object_ref = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp observed_at = 7;
  optional string conversation_ref = 8;
  optional string actor_entity_ref = 9;
  google.protobuf.Struct context = 10;
}
message SourceRegion { string source_region_id = 1; string artifact_id = 2; string coordinate_kind = 3; google.protobuf.Struct coordinate = 4; string coordinate_hash = 5; optional string parent_source_region_id = 6; }
message DerivedRepresentation {
  string representation_id = 1;
  string subject_id = 2;
  optional string source_region_id = 3;
  string kind = 4;
  string producer_signature = 5;
  int32 revision = 6;
  optional string text = 7;
  optional string artifact_id = 8;
}
message ComponentStatus { string name = 1; string state = 2; optional string detail = 3; }
message SystemStatus { repeated ComponentStatus components = 1; }
message EffectiveConfigEntry { string key = 1; string value = 2; string source = 3; string owner = 4; bool restart_required = 5; bool editable = 6; }
message EffectiveConfig { repeated EffectiveConfigEntry entries = 1; }
message ProjectionStatus { repeated ComponentStatus families = 1; }
service ResourceService {
  rpc PutResource(PutResourceRequest) returns (ResourceDescriptor);
  rpc GetResource(ObjectRequest) returns (ResourceDescriptor);
  rpc ListResources(ListRequest) returns (ListResourcesResponse);
  rpc RemoveResource(ObjectRequest) returns (google.protobuf.Empty);
}
service TopologyService {
  rpc CreateTag(CreateTagRequest) returns (Tag);
  rpc GetTag(ObjectRequest) returns (Tag);
  rpc ListTags(ListRequest) returns (ListTagsResponse);
  rpc CreateAnchor(CreateAnchorRequest) returns (Anchor);
  rpc GetAnchor(ObjectRequest) returns (Anchor);
  rpc ListAnchors(ListRequest) returns (ListAnchorsResponse);
  rpc CreateAssociation(CreateAssociationRequest) returns (Association);
  rpc GetNeighborhood(NeighborhoodRequest) returns (NeighborhoodResponse);
  rpc RebindEntity(RebindEntityRequest) returns (google.protobuf.Empty);
}
service SystemService {
  rpc GetStatus(google.protobuf.Empty) returns (SystemStatus);
  rpc GetCapabilities(google.protobuf.Empty) returns (SystemStatus);
  rpc GetEffectiveConfig(google.protobuf.Empty) returns (EffectiveConfig);
  rpc GetProjectionStatus(SubjectRequest) returns (ProjectionStatus);
}

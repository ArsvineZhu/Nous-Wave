[server]
bind = "127.0.0.1:9470"
remote_access = false

[database]
mode = "managed"
url = ""
max_connections = 8
name = "nous_wave_20260907"
install_dir = "./data/postgres-install"
data_dir = "./data/postgres"

[object_store]
backend = "fs"
root = "./data/objects"
max_upload_bytes = 8589934592

[retrieval]
resident_limit = 256

[retrieval.lexical]
enabled = true
path = "./data/lexical"

[retrieval.dense]
enabled = true
path = "./data/dense"

[retrieval.wave]
enabled = true
path = "./data/wave"


# Nous Wave reference local configuration.
# There is intentionally NO scheduler / cron / dream-time / diary-time section.

[server]
bind = "127.0.0.1:7417"
remote_access = false

[microsystems]
memory = true
# Future MicroSystems are not configurable until implemented.

[postgres]
url = "postgresql://nous_wave@127.0.0.1:5432/nous_wave"
max_connections = 12

[object_store]
backend = "fs"
root = "./data/objects"
max_upload_bytes = 8589934592

[retrieval]
lancedb_uri = "./data/lancedb"
default_effort = "normal"

[retrieval.budgets.light]
max_candidates = 24
max_association_states = 64
max_association_edges = 256

[retrieval.budgets.normal]
max_candidates = 64
max_association_states = 256
max_association_edges = 1500

[retrieval.budgets.deep]
max_candidates = 160
max_association_states = 1200
max_association_edges = 8000

[retrieval.budgets.maximum]
max_candidates = 400
max_association_states = 5000
max_association_edges = 40000

[association]
# Algorithm defaults are implementation parameters, not public cognitive semantics.
outbound_mass = 0.95
backtrack_factor = 0.12
min_activation = 0.00001
max_hops = 8

[accessibility]
# Baseline model parameters; change only with documented algorithm intent.
use_decay = 0.5

[models.embedding]
enabled = false
mode = "local"
endpoint = "http://127.0.0.1:8001"
model = "configured-by-operator"
cache_dir = "./models"

[models.rerank]
enabled = false
endpoint = "http://127.0.0.1:8002"
model = "configured-by-operator"

[models.generation]
enabled = false
endpoint = "http://127.0.0.1:8000"
model = "configured-by-operator"

[processing]
worker_concurrency = 4
claim_batch = 16
# Polling is processing recovery mechanics, not autonomous cognitive scheduling.
reconcile_interval_ms = 2000
